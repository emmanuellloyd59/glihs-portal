name: Automated tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "version-4/**"]
  workflow_dispatch:

permissions:
  contents: read

# Run the latest PR revision instead of queueing duplicate push + PR runs.
concurrency:
  group: cmhs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cmhs_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cmhs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmhs_test -d cmhs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run regression tests
        env:
          SECRET_KEY: ci-only-test-secret
          SESSION_COOKIE_SECURE: "false"
          TEST_POSTGRES_URL: postgresql://cmhs_test:ci-only-password@localhost:5432/cmhs_test
        run: python -m unittest discover -s tests -v
